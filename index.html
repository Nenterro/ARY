<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <!--
      ARY's image CDN is hotlink-protected: it serves a poster when the request
      carries no Referer, or one from aryplus.tv, and returns 403 for any other
      origin. Suppressing the Referer document-wide is what makes the posters
      load. It has to be the document policy rather than an attribute on each
      <img>, because the series hero uses a CSS background-image, and CSS has
      no per-rule equivalent of referrerpolicy.

      This does not affect API calls: CORS is negotiated with Origin, which is
      sent regardless, and the backend never inspects Referer.
    -->
    <meta name="referrer" content="no-referrer" />
    <title>ARY Downloader</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
